<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>

    <script src="./config.js"></script>

    <link id="favicon" rel="icon" type="image/png" href="">
    <style>
        :root {
            --bg: #111;
            --fg: #fff;
            --accent: #4da3ff;
        }

        body.light {
            --bg: #f5f5f5;
            --fg: #111;
            --accent: #0066cc;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--fg);
            font-family: "Inter", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: background 0.4s, color 0.4s;
        }

        .wrapper {
            text-align: center;
            animation: fadeIn 1s ease-out;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        .container {
            display: flex;
            gap: 30px;
            justify-content: center;
            animation: slideUp 0.8s ease-out;
        }

        .block {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 80px;
        }

        .value {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent);
            transition: transform 0.2s;
        }

        .value.animate {
            transform: scale(1.15);
        }

        .label {
            margin-top: 5px;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        /* Mobile stacked layout */
        @media (max-width: 600px) {
            .container {
                flex-direction: column;
                gap: 15px;
            }

            .value {
                font-size: 2.5rem;
            }
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toggle button */
        #modeToggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--accent);
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
    </style>
</head>

<body>

    <button id="modeToggle">Light Mode</button>

    <div class="wrapper">
        <h1 id="title"></h1>

        <div class="container">
            <div class="block">
                <div class="value" id="days">0</div>
                <div class="label">Days</div>
            </div>
            <div class="block">
                <div class="value" id="hours">0</div>
                <div class="label">Hours</div>
            </div>
            <div class="block">
                <div class="value" id="minutes">0</div>
                <div class="label">Minutes</div>
            </div>
            <div class="block">
                <div class="value" id="seconds">0</div>
                <div class="label">Seconds</div>
            </div>
        </div>
    </div>

    <script>
        document.title = CONFIG.title;
        document.getElementById("title").textContent = CONFIG.title;
        document.getElementById("favicon").href = CONFIG.favicon;

        const targetDate = new Date(CONFIG.targetDate);

        /* Dark/Light mode toggle */
        const body = document.body;
        const toggleBtn = document.getElementById("modeToggle");

        if (localStorage.getItem("theme") === "light") {
            body.classList.add("light");
            toggleBtn.textContent = "Dark Mode";
        }

        toggleBtn.onclick = () => {
            body.classList.toggle("light");
            const isLight = body.classList.contains("light");
            toggleBtn.textContent = isLight ? "Dark Mode" : "Light Mode";
            localStorage.setItem("theme", isLight ? "light" : "dark");
        };

        /* Helper: pad single digits with leading zero */
        function pad(n) {
            return n.toString().padStart(2, "0");
        }

        /* Timer logic */
        function animateValue(el) {
            el.classList.add("animate");
            setTimeout(() => el.classList.remove("animate"), 200);
        }

        function updateTimer() {
            const now = new Date();
            const diff = targetDate - now;
            const abs = Math.abs(diff);

            const d = Math.floor(abs / (1000 * 60 * 60 * 24));
            const h = Math.floor(abs / (1000 * 60 * 60)) % 24;
            const m = Math.floor(abs / (1000 * 60)) % 60;
            const s = Math.floor(abs / 1000) % 60;

            const ids = ["days", "hours", "minutes", "seconds"];
            const values = [d, h, m, s];

            values.forEach((val, i) => {
                const el = document.getElementById(ids[i]);
                const padded = pad(val);
                if (el.textContent !== padded) animateValue(el);
                el.textContent = padded;
            });
        }

        updateTimer();
        setInterval(updateTimer, 1000);
    </script>


</body>

</html>
