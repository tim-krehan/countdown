<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link id="favicon" rel="icon" type="image/png" href="">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="top-buttons">
        <button id="modeToggle">Light Mode</button>
        <button id="autoToggle">Auto ▶️</button>
        <button id="shareBtn">Share 🔗</button>
    </div>

    <div id="prevBtn" class="nav-btn" aria-label="Previous countdown">&lt;</div>
    <div id="nextBtn" class="nav-btn" aria-label="Next countdown">&gt;</div>

    <div class="wrapper">
        <h1 id="title"></h1>

        <div id="slides" class="slide-container"></div>

        <div class="progress">
            <div id="progressBar"></div>
        </div>

        <div class="dots" id="dots"></div>

        <div class="swipe-hint" id="swipeHint">← Swipe →</div>
    </div>

    <div id="toast">Copied!</div>

    <script>
        const cfg = document.createElement("script");
        cfg.src = "./config.js?v=" + Date.now();
        cfg.onload = () => {
            const main = document.createElement("script");
            main.src = "script.js";
            document.body.appendChild(main);
        };
        document.head.appendChild(cfg);
    </script>


</body>

</html>
